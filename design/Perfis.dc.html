<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; background: #FBFBFB; color: #181718; }
    a { color: #2283EE; } a:hover { color: #1967D2; }
    button { font-family: inherit; cursor: pointer; }
    .linha:hover { background: #f9f9fa; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; width: 460px; height: 480px; background: #FBFBFB; box-sizing: border-box;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 20px 28px 0 28px;">
    <button style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; background: transparent; border: none; border-radius: 6px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#414141" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 6.5 L8.5 12 L14 17.5"></path>
      </svg>
    </button>
    <span style="font-size: 15px; font-weight: 600;">Perfis</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 1px; margin: 18px 28px 0 28px; background: #e7e7e7; border: 1px solid #e7e7e7; border-radius: 8px; overflow: hidden;">
    <sc-for list="{{perfis}}" as="p" hint-placeholder-count="2">
      <div class="linha" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #ffffff;">
        <button onClick="{{p.usar}}" style="display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; padding: 0; background: transparent; border: none; flex-shrink: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{p.corMarca}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.4 A8.6 8.6 0 1 0 12 20.6 A8.6 8.6 0 0 0 12 3.4 Z"></path>
            <path d="M8.6 12.1 L11 14.5 L15.6 9.8" opacity="{{p.opacidadeCheck}}"></path>
          </svg>
        </button>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
          <span style="font-size: 13.5px; font-weight: 500;">{{p.nome}}</span>
          <span style="font-size: 11.5px; color: #858585;">{{p.endereco}}</span>
        </div>
        <span style="font-size: 11px; font-weight: 600; color: #46921e; flex-shrink: 0; opacity: {{p.opacidadeEmUso}};">em uso</span>
        <button style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; background: transparent; border: none; border-radius: 6px; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#858585" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.6 4.6 L19.4 8.4 L8.6 19.2 L4 20 L4.8 15.4 Z"></path>
          </svg>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="padding: 14px 28px 0 28px;">
    <button style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; font-size: 13px; font-weight: 500; color: #414141; background: #ffffff; border: 1px solid #d1d1d1; border-radius: 8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#414141" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5.6 V18.4"></path>
        <path d="M5.6 12 H18.4"></path>
      </svg>
      <span>Adicionar perfil</span>
    </button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":460,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ativo: 0 };
  }

  renderVals() {
    const dados = [
      { nome: 'Escritório', endereco: 'proxy.interno:3128' },
      { nome: 'Casa', endereco: 'configuração automática (.pac)' },
    ];
    return {
      perfis: dados.map((p, i) => ({
        ...p,
        corMarca: i === this.state.ativo ? '#46921e' : '#d1d1d1',
        opacidadeCheck: i === this.state.ativo ? '1' : '0',
        opacidadeEmUso: i === this.state.ativo ? '1' : '0',
        usar: () => this.setState({ ativo: i }),
      })),
    };
  }
}
</script>
</body>
</html>
